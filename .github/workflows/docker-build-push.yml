name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Serialize releases because every version updates the shared latest/full tags.
concurrency:
  group: docker-release
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: fengyu666/webmoniter

jobs:
  validate:
    uses: ./.github/workflows/quality.yml

  # Push by digest only; public version/latest tags are updated after all checks.
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [slim, full]
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4

      - name: Verify Docker Hub secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "::error::DOCKER_USERNAME / DOCKER_PASSWORD secrets must be set"
            exit 1
          fi

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push native image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          target: ${{ matrix.variant }}
          platforms: linux/${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # Registry caches are reusable across version tags; GHA caches are ref-scoped.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.variant }}-${{ matrix.platform.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.variant }}-${{ matrix.platform.arch }},mode=max,image-manifest=true,oci-mediatypes=true

      - name: Pull and verify the native image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.platform.arch }}
        run: |
          # Retry only on registry propagation errors instead of always sleeping.
          for attempt in 1 2 3 4 5; do
            if docker pull "$IMAGE"; then break; fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep "$((attempt * 3))"
          done
          test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE")" = "$ARCH"
          docker run --rm --entrypoint sh "$IMAGE" -c '
            if [ "$1" = full ]; then
              test -x /usr/bin/chromium
            else
              test ! -x /usr/bin/chromium
            fi' sh "$VARIANT"
          python scripts/container_benchmark.py --image "$IMAGE" --seconds 5 --smoke-only --output image-smoke.json
          docker image inspect --format '{{.Architecture}} {{.Size}}' "$IMAGE" > image-store-sizes.txt
          docker history --no-trunc --format '{{.ID}} {{.Size}}' "$IMAGE" > image-layers.txt

      - name: Export verified digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v6
        with:
          name: image-digests-${{ matrix.variant }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: image-smoke-${{ matrix.variant }}-${{ matrix.platform.arch }}
          path: |
            image-smoke.json
            image-store-sizes.txt
            image-layers.txt
          retention-days: 7

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: slim
            suffix: ''
            rolling-tag: latest
          - variant: full
            suffix: '-full'
            rolling-tag: full
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digests-${{ matrix.variant }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},suffix=${{ matrix.suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.suffix }}
            type=semver,pattern={{major}},suffix=${{ matrix.suffix }}
            type=raw,value=${{ matrix.rolling-tag }}

      - name: Publish multi-platform manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          digests=(*)
          test "${#digests[@]}" -eq 2
          sources=()
          for digest in "${digests[@]}"; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            sources+=("$IMAGE@sha256:$digest")
          done
          tags=()
          while IFS= read -r tag; do
            tags+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          while IFS= read -r tag; do
            docker buildx imagetools inspect --raw "$tag" | jq -e '
              [.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
          done <<< "$TAGS"
