# 构建并部署文档站到 GitHub Pages（MkDocs Material）
name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.26'
          enable-cache: true
          cache-suffix: docs
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: |
          uv export --frozen --extra docs --no-dev --no-emit-project --no-hashes -o "$RUNNER_TEMP/docs-constraints.txt"
          python -c 'import tomllib; from pathlib import Path; print("\n".join(tomllib.loads(Path("pyproject.toml").read_text())["project"]["optional-dependencies"]["docs"]))' > "$RUNNER_TEMP/docs-requirements.txt"
          uv venv
          uv pip install -r "$RUNNER_TEMP/docs-requirements.txt" -c "$RUNNER_TEMP/docs-constraints.txt"

      - name: Deploy to GitHub Pages
        run: .venv/bin/mkdocs gh-deploy --force -f docs/mkdocs.yml
