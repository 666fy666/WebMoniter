name: Quality and browser regression
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_call:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'push' && github.ref_type == 'branch'
      # Tag builds and manual releases always run the complete validation.
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
        with:
          base: ${{ github.ref }}
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!LICENSE'

  backend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: bash -n install.sh && sh -n docker/docker-entrypoint.sh
      - run: docker compose config --quiet && docker compose -f docker/docker-compose.yml config --quiet && docker compose -f docker/docker-compose.full.yml config --quiet
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.15'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.26'
          enable-cache: true
          cache-suffix: backend
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev --extra rainyun
      - run: .venv/bin/ruff check .
      - run: .venv/bin/python -m pytest -q

  frontend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.15'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.26'
          enable-cache: true
          cache-suffix: frontend
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@v4
        id: dist
        with:
          path: frontend/dist
          key: frontend-dist-v1-${{ runner.os }}-node24.14.0-${{ hashFiles('frontend/**') }}
      - run: npm ci --prefix frontend --prefer-offline --no-audit --no-fund
      - run: npm run format:check --prefix frontend
      - run: npm run test --prefix frontend
      - run: npm run build --prefix frontend
        if: steps.dist.outputs.cache-hit != 'true'
      - run: uv sync --frozen --no-dev --no-install-project
      - run: cd frontend && npx playwright install --with-deps chromium
      # One isolated server; desktop contracts and mobile interaction smoke tests stay serial.
      - run: npm run test:e2e --prefix frontend
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-regression
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7

  # Keep the existing required check green for docs-only changes, and fail it
  # if any required job fails or is unexpectedly skipped.
  checks:
    if: always()
    needs: [changes, backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check required results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$CODE_CHANGED" = true ]; then
            test "$BACKEND_RESULT" = success
            test "$FRONTEND_RESULT" = success
          fi
