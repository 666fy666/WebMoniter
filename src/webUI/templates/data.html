{% extends "base.html" %}
{% from "partials/icon.html" import icon %}
{% block body_class %} class="page-data"{% endblock %}
{% block content %}
<div class="tabs-scroll-wrap">
                <div class="tabs" role="tablist" aria-label="数据来源">
                    <button class="tab-btn active" type="button" role="tab" aria-selected="true" data-table="weibo">{{ icon('comment') }} 微博数据</button>
                    <button class="tab-btn" type="button" role="tab" aria-selected="false" data-table="huya">{{ icon('radar') }} 虎牙数据</button>
                    <button class="tab-btn" type="button" role="tab" aria-selected="false" data-table="bilibili_live">{{ icon('play') }} 哔哩哔哩直播</button>
                    <button class="tab-btn" type="button" role="tab" aria-selected="false" data-table="bilibili_dynamic">{{ icon('play') }} 哔哩哔哩动态</button>
                    <button class="tab-btn" type="button" role="tab" aria-selected="false" data-table="douyin">{{ icon('play') }} 抖音直播</button>
                    <button class="tab-btn" type="button" role="tab" aria-selected="false" data-table="douyu">{{ icon('play') }} 斗鱼直播</button>
                    <button class="tab-btn" type="button" role="tab" aria-selected="false" data-table="xhs">{{ icon('module') }} 小红书数据</button>
                </div>
            </div>
            <div class="card fade-in">
                <div class="card-body">
                    <div id="dataTableContainer" class="table-container">
                        <div class="loading">加载中...</div>
                    </div>
                    <div id="pagination" class="pagination"></div>
                </div>
            </div>
{% endblock %}
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="/static/js/data.js?v=6"></script>
{% endblock %}
