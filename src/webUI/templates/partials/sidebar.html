<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <a href="/config" class="sidebar-brand" title="WebMoniter">
            <img src="/static/favicon.svg" alt="" class="sidebar-logo" width="36" height="36">
            <div class="sidebar-brand-text">
                <span class="sidebar-title">WebMoniter</span>
                <span class="sidebar-tagline">多平台监控</span>
            </div>
        </a>
    </div>
    <nav class="sidebar-nav">
        <a href="/config" class="nav-item{% if active_nav == 'config' %} active{% endif %}"{% if active_nav == 'config' %} aria-current="page"{% endif %}>
            <span class="nav-icon">{{ icon('settings') }}</span>
            <span class="nav-text">配置管理</span>
        </a>
        <a href="/tasks" class="nav-item{% if active_nav == 'tasks' %} active{% endif %}"{% if active_nav == 'tasks' %} aria-current="page"{% endif %}>
            <span class="nav-icon">{{ icon('tasks') }}</span>
            <span class="nav-text">任务管理</span>
        </a>
        <a href="/data" class="nav-item{% if active_nav == 'data' %} active{% endif %}"{% if active_nav == 'data' %} aria-current="page"{% endif %}>
            <span class="nav-icon">{{ icon('chart') }}</span>
            <span class="nav-text">数据展示</span>
        </a>
        <a href="/logs" class="nav-item{% if active_nav == 'logs' %} active{% endif %}"{% if active_nav == 'logs' %} aria-current="page"{% endif %}>
            <span class="nav-icon">{{ icon('logs') }}</span>
            <span class="nav-text">日志查看</span>
        </a>
    </nav>
    <div class="sidebar-footer">
        <button id="themeToggleBtn" class="btn btn-secondary">
            <span id="themeIcon">{{ icon('sun') }}</span>
            切换主题
        </button>
        <button id="changePasswordBtn" class="btn btn-secondary">
            {{ icon('lock') }}
            修改密码
        </button>
        <button id="logoutBtn" class="btn btn-secondary">
            {{ icon('logout') }}
            退出登录
        </button>
    </div>
    <div class="version-info">
        <a id="currentVersion" href="#" target="_blank">加载中...</a>
    </div>
</div>
<button
    type="button"
    class="sidebar-collapse-handle"
    id="sidebarCollapseHandle"
    aria-controls="sidebar"
    aria-expanded="true"
    aria-label="收起侧边栏"
    title="收起侧边栏"
>
    <span class="sidebar-collapse-handle-grip" aria-hidden="true"></span>
</button>
